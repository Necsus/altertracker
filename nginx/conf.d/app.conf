server {
    listen 80;
    server_name altertracker.com www.altertracker.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name altertracker.com www.altertracker.com;

    ssl_certificate /etc/letsencrypt/live/altertracker.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/altertracker.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    if (-f /usr/share/nginx/html/maintenance.html) {
        return 503;
    }

    error_page 503 @maintenance;

    location @maintenance {
        root /usr/share/nginx/html;
        rewrite ^.*$ /maintenance.html break;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With";
    }

    location /robots.txt {
        root /etc/nginx/static;
        allow all;
    }
}