server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # ✅ Route 1 : Reload player avec timeout 30min
    location ~ ^/api/player/reload/ {
        proxy_pass http://api.altertracker.svc.cluster.local:5000;
        proxy_http_version 1.1;
        
        # Timeouts de 30 minutes
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        
        # Headers pour le proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Désactiver le buffering pour les longues requêtes
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ✅ Route 2 : Import player BGA avec timeout 30min
    location ~ ^/api/player/importbga/ {
        proxy_pass http://api.altertracker.svc.cluster.local:5000;
        proxy_http_version 1.1;
        
        # Timeouts de 30 minutes
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        
        # Headers pour le proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Désactiver le buffering pour les longues requêtes
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ✅ Route 3 : Import ladder avec timeout 30min
    location ~ ^/api/player/importladder/ {
        proxy_pass http://api.altertracker.svc.cluster.local:5000;
        proxy_http_version 1.1;
        
        # Timeouts de 30 minutes
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        
        # Headers pour le proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Désactiver le buffering pour les longues requêtes
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ✅ Route 4 : Import table avec timeout 30min
    location ~ ^/api/player/importtable/ {
        proxy_pass http://api.altertracker.svc.cluster.local:5000;
        proxy_http_version 1.1;
        
        # Timeouts de 30 minutes
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        
        # Headers pour le proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Désactiver le buffering pour les longues requêtes
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}