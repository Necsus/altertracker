<div class="container p-4 flex min-h-screen">
  <div class="w-1/4 bg-gray-800 text-white overflow-auto">
    <h2 class="text-lg font-bold p-2">Conversations</h2>
    <ul>
      <li *ngFor="let room of rooms" (click)="selectRoom(room)" [class.bg-gray-700]="room === activeRoom"
        class="p-2 cursor-pointer hover:bg-gray-700">
        Conversation #{{ room.id }}
        <span *ngIf="!room.is_open" class="text-red-400 ml-2">(Fermée)</span>
      </li>
    </ul>
  </div>
  <div class="flex-1 bg-gray-900 text-white flex flex-col">
    <div class="flex-1 overflow-auto p-4">
      <div *ngFor="let msg of activeRoom?.messages">
        <div>
          <strong>{{ msg.sender_id }}:</strong> {{ msg.content }}
        </div>
      </div>
    </div>
    <div class="p-4 border-t border-gray-700">
      <input [(ngModel)]="newMessage" placeholder="Message..." class="w-full p-2 rounded bg-gray-700 text-white" />
      <button (click)="sendMessage()" class="mt-2 bg-blue-600 px-4 py-2 rounded">Envoyer</button>
      <button *ngIf="activeRoom && activeRoom?.is_open" (click)="closeRoom(activeRoom)"
        class="mt-2 bg-red-500 px-4 py-2 ml-2 rounded">Clôturer</button>
    </div>
  </div>
</div>
