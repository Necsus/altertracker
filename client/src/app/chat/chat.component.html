<div class="w-full h-32 bg-gray-900"></div>

<div class="container mx-auto" style="margin-top: -128px;">
  <div class="py-6">
    <div class="flex border border-gray-700 rounded shadow-lg bg-gray-900">

      <!-- Left -->
      <div class="w-1/3 border-r border-gray-700 flex flex-col bg-gray-800 scroll-container overflow-auto">

        <!-- Search -->
        <div class="py-2 px-2 bg-gray-800">
          <input type="text" class="w-full px-2 py-2 text-sm bg-gray-700 text-gray-200 rounded"
            placeholder="Search or start new chat" />
        </div>

        <!-- Contacts -->
        <div class="bg-gray-800 flex-1 overflow-auto">
          <div *ngFor="let room of rooms" (click)="selectRoom(room)"
            class="px-3 flex items-center bg-gray-700 cursor-pointer hover:bg-gray-600">
            <!-- <div>
              <img class="h-12 w-12 rounded-full"
                src="https://darrenjameseeley.files.wordpress.com/2014/09/expendables3.jpeg" />
            </div> -->
            <div class="ml-4 flex-1 border-b border-gray-700 py-4">
              <div class="flex items-bottom justify-between">
                <p class="text-gray-100">
                  {{ room.reference_card }}
                </p>
                <!-- <p class="text-xs text-gray-400">
                  12:45 pm
                </p> -->
              </div>
              <!-- <p class="text-gray-400 mt-1 text-sm">
                Afficher ici le dernier message
              </p> -->
            </div>
          </div>
          <!-- Répète pour chaque contact, adapte les couleurs -->
        </div>
      </div>

      <!-- Right -->
      <div class="w-2/3 flex flex-col bg-gray-900">

        <!-- Header -->
        @if (activeRoom) {
        <div class="py-2 px-3 bg-gray-900 flex flex-row justify-between items-center border-b border-gray-700">
          <div class="flex items-center">
            <!-- <div>
              <img class="w-10 h-10 rounded-full"
                src="https://darrenjameseeley.files.wordpress.com/2014/09/expendables3.jpeg" />
            </div> -->
            <div class="ml-4">
              <p class="text-gray-100">
                {{ activeRoom.reference_card }}
              </p>
              <!-- <p class="text-gray-400 text-xs mt-1">
                Andrés, Tom, Harrison, Arnold, Sylvester
              </p> -->
            </div>
          </div>
          <div class="flex">
            <!-- ...SVG icons... -->
          </div>
        </div>
        <div class="overflow-auto scroll-container h-96" #scrollContainer>
          <div *ngFor="let message of activeRoom.messages" class="flex-1 bg-gray-800">
            <div class="py-2 px-3">

              <!-- <div class="flex justify-center mb-2">
              <div class="rounded py-2 px-4 bg-gray-700">
                <p class="text-sm uppercase text-gray-300">
                  February 20, 2018
                </p>
              </div>
            </div> -->

              <div class="flex justify-center mb-4" *ngIf="message.sender === 'admin'">
                <div class="rounded py-2 px-4 bg-yellow-900">
                  <p class="text-xs text-yellow-200">
                    {{ message.content }}
                  </p>
                </div>
              </div>

              <!-- Message de gauche BUYER -->
              <div class="flex mb-2" *ngIf="message.sender === 'other'">
                <div class="rounded py-2 px-3 bg-gray-700">
                  <!-- <p class="text-sm text-gray-300">
                  Contact
                </p> -->
                  <p class="text-sm mt-1 text-gray-200">
                    {{ message.content }}
                  </p>
                  <p class="text-right text-xs text-gray-400 mt-1">
                    {{ message.sent_at | date:'shortTime' }}
                  </p>
                </div>
              </div>

              <!-- Message de droite ME -->
              <div class="flex justify-end mb-2" *ngIf="message.sender === 'me'">
                <div class="rounded py-2 px-3 bg-green-900">
                  <p class="text-sm mt-1 text-gray-100">
                    {{ message.content }}
                  </p>
                  <p class="text-right text-xs text-gray-400 mt-1">
                    {{ message.sent_at | date:'shortTime' }}
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="bg-gray-900 px-4 py-4 flex items-center border-t border-gray-700">
          <div>
            <!-- ...SVG icon... -->
          </div>
          <div class="flex-1 mx-4">
            <input [(ngModel)]="newMessage" (keyup.enter)="sendMessage()"
              class="w-full border border-gray-700 rounded px-2 py-2 bg-gray-800 text-gray-200" type="text" />
          </div>
          <div>
            <button (click)="sendMessage()" type="button" class="text-blue-400 hover:text-blue-300 text-xl">
              <i class="fas fa-paper-plane"></i>
            </button>
          </div>
        </div>
        }
      </div>
    </div>
  </div>
</div>
