<div class="bg-gray-800 rounded-xl p-6 shadow-lg">
  <h2 class="text-xl font-bold text-white mb-6 flex items-center gap-2">
    <svg class="w-6 h-6 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
      </path>
    </svg>
    Statistiques générales
  </h2>

  <div class="space-y-4">
    <div
      class="flex items-center justify-between p-4 bg-gradient-to-r from-amber-900 to-amber-800 rounded-lg border border-amber-500">
      <span class="text-amber-100 font-semibold">Total parties</span>
      <span class="text-2xl font-bold text-white">{{ totalGames() }}</span>
    </div>

    <div class="flex items-center justify-between p-4 bg-gray-900 rounded-lg border-l-4 border-green-500">
      <span class="text-gray-300">Victoires</span>
      <span class="text-2xl font-bold text-green-400">{{ player().total_wins || 0 }}</span>
    </div>

    <div class="flex items-center justify-between p-4 bg-gray-900 rounded-lg border-l-4 border-red-500">
      <span class="text-gray-300">Défaites</span>
      <span class="text-2xl font-bold text-red-400">{{ player().total_losses || 0 }}</span>
    </div>

  </div>

  <!-- Win Rate Progress -->
  <div class="mt-6">
    <div class="flex justify-between mb-2">
      <span class="text-gray-300 text-sm font-medium">Taux de victoire</span>
      <span class="text-amber-400 font-bold">{{ player().win_rate || 0 | number: '1.0-0' }}%</span>
    </div>
    <div class="w-full bg-gray-700 rounded-full h-3 overflow-hidden">
      <div class="h-full rounded-full transition-all duration-500 ease-out" [style.width.%]="player()!.win_rate || 0"
        [class.bg-gradient-to-r]="true" [class.from-green-500]="(player()!.win_rate || 0) >= 70"
        [class.to-green-400]="(player()!.win_rate || 0) >= 70"
        [class.from-blue-500]="(player()!.win_rate || 0) >= 50 && (player()!.win_rate || 0) < 70"
        [class.to-blue-400]="(player()!.win_rate || 0) >= 50 && (player()!.win_rate || 0) < 70"
        [class.from-orange-500]="(player()!.win_rate || 0) < 50" [class.to-orange-400]="(player()!.win_rate || 0) < 50">
      </div>
    </div>
  </div>
</div>
