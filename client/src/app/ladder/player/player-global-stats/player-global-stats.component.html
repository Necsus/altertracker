<div class="bg-gray-800 rounded-xl p-6 shadow-lg">
  <h2 class="text-xl font-bold text-white mb-6 flex items-center gap-2">
    <svg class="w-6 h-6 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z">
      </path>
    </svg>
    Statistiques globales (toutes saisons)
  </h2>

  <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    <!-- Total Parties -->
    <div class="bg-gray-900 rounded-lg p-4 border-l-4 border-amber-500">
      <div class="text-gray-400 text-sm mb-1">Total parties</div>
      <div class="text-3xl font-bold text-white">{{ totalGames() }}</div>
    </div>

    <!-- Total Wins -->
    <div class="bg-gray-900 rounded-lg p-4 border-l-4 border-green-500">
      <div class="text-gray-400 text-sm mb-1">Victoires</div>
      <div class="text-3xl font-bold text-green-400">{{ player().total_wins || 0 }}</div>
    </div>

    <!-- Total Losses -->
    <div class="bg-gray-900 rounded-lg p-4 border-l-4 border-red-500">
      <div class="text-gray-400 text-sm mb-1">Défaites</div>
      <div class="text-3xl font-bold text-red-400">{{ player().total_losses || 0 }}</div>
    </div>

    <!-- Global Win Rate -->
    <div class="bg-gray-900 rounded-lg p-4 border-l-4 border-amber-500">
      <div class="text-gray-400 text-sm mb-1">Win rate global</div>
      <div class="text-3xl font-bold text-amber-400">{{ player().win_rate || 0 | number: '1.0-0' }}%</div>
    </div>
  </div>
</div>
