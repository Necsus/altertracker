<div class="bg-gray-900 text-white p-6">
  <div class="max-w-7xl mx-auto space-y-12">

    <section class="text-gray-100 bg-gray-900 px-6 py-12 md:px-12 lg:px-24">
      <div class="max-w-4xl mx-auto text-center">
        <h1 class="text-4xl md:text-5xl font-bold text-white mb-6">
          Ma Collection
        </h1>
        <p class="text-lg text-gray-300 mb-8">
          Vous devez avoir saisi votre&nbsp;<a routerLink="/token" [queryParams]="{ callback: 'collection' }"
            class="text-indigo-400 font-semibold cursor-pointer">Token
            Altered</a><br />
          Importer votre collection vous permettra de suivre vos cartes (UNIQUE) et de pouvoir échanger avec d'autres
          joueurs en
          utilisant la fonctionnalité&nbsp;<a routerLink="/purchase-offers"
            class="text-indigo-400 font-semibold cursor-pointer">Offres d'achat</a>
        </p>
        <a (click)="importCollection()"
          class="inline-block bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 px-6 rounded-2xl shadow-lg transition duration-200 cursor-pointer">
          Commencer l'importation
        </a>
      </div>
    </section>
  </div>
</div>
