<div class="flex h-full bg-zinc-900 text-white overflow-hidden">
  <!-- Sidebar : Contacts -->
  <aside class="w-72 border-r border-zinc-800 overflow-y-auto bg-zinc-950">
    <div class="p-4 text-lg font-semibold border-b border-zinc-800">
      Messages
    </div>
    <ul>
      <li class="flex items-center px-4 py-3 hover:bg-zinc-800 cursor-pointer gap-3">
        <div class="relative">
          <img src="https://i.pravatar.cc/40?u=user1" alt="User" class="w-10 h-10 rounded-full" />
          <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-zinc-950 rounded-full"></span>
        </div>
        <div class="flex-1">
          <div class="font-medium">Alice Dupont</div>
          <div class="text-sm text-zinc-400 truncate">Hey, t'es là ?</div>
        </div>
        <span class="text-xs text-zinc-500">14:32</span>
      </li>
      <li class="flex items-center px-4 py-3 hover:bg-zinc-800 cursor-pointer gap-3">
        <div class="relative">
          <img src="https://i.pravatar.cc/40?u=user2" alt="User" class="w-10 h-10 rounded-full" />
          <span class="absolute bottom-0 right-0 w-3 h-3 bg-gray-500 border-2 border-zinc-950 rounded-full"></span>
        </div>
        <div class="flex-1">
          <div class="font-medium">Jean Martin</div>
          <div class="text-sm text-zinc-400 truncate">Ok pour demain.</div>
        </div>
        <span class="text-xs text-zinc-500">13:17</span>
      </li>
    </ul>
  </aside>

  <!-- Main : Messages -->
  <main class="flex-1 flex flex-col justify-between">
    <!-- Top bar with contact -->
    <div class="flex items-center gap-4 px-6 py-4 border-b border-zinc-800">
      <img src="https://i.pravatar.cc/40?u=user1" alt="User" class="w-10 h-10 rounded-full" />
      <div>
        <div class="font-semibold text-white">Alice Dupont</div>
        <div class="text-xs text-zinc-400">En ligne</div>
      </div>
    </div>

    <!-- Messages list -->
    <div class="flex-1 overflow-y-auto px-6 py-4 space-y-4">
      <!-- Other user message -->
      <div class="flex items-end gap-3">
        <img src="https://i.pravatar.cc/40?u=user1" class="w-8 h-8 rounded-full" />
        <div>
          <div class="bg-zinc-800 text-sm rounded-xl px-4 py-2 max-w-md">Salut, comment tu vas ?</div>
          <div class="text-xs text-zinc-500 mt-1">14:30</div>
        </div>
      </div>

      <!-- My message -->
      <div class="flex items-end gap-3 justify-end">
        <div class="text-right">
          <div class="bg-blue-600 text-sm rounded-xl px-4 py-2 max-w-md text-white">Très bien et toi ?</div>
          <div class="text-xs text-zinc-500 mt-1">14:31</div>
        </div>
      </div>

      <!-- Other message -->
      <div class="flex items-end gap-3">
        <img src="https://i.pravatar.cc/40?u=user1" class="w-8 h-8 rounded-full" />
        <div>
          <div class="bg-zinc-800 text-sm rounded-xl px-4 py-2 max-w-md">Je voulais te parler d'un truc !</div>
          <div class="text-xs text-zinc-500 mt-1">14:32</div>
        </div>
      </div>
    </div>

    <!-- Input bar -->
    <div class="border-t border-zinc-800 p-4 bg-zinc-950">
      <div class="flex items-center gap-3">
        <input type="text" placeholder="Écris un message..."
          class="flex-1 bg-zinc-800 text-white placeholder-zinc-500 rounded-full px-4 py-2 border border-zinc-700 focus:outline-none" />
        <button class="p-2 hover:bg-zinc-800 rounded-full text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M22 2L11 13"></path>
            <path stroke-linecap="round" stroke-linejoin="round" d="M22 2L15 22l-4-9-9-4 20-7z"></path>
          </svg>
        </button>
      </div>
    </div>
  </main>
</div>
