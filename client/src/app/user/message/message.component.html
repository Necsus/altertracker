<div class="bg-gray-900 text-white p-6">
  <div class="max-w-4xl mx-auto space-y-12">
    <div class="flex h-full bg-gray-900 text-white overflow-hidden">
      <!-- Sidebar : Contacts -->
      <aside class="w-72 border-r border-gray-800 overflow-y-auto bg-gray-950">
        <div class="p-4 text-lg font-semibold border-b border-gray-800">
          Messages
        </div>
        <ul>
          <li class="flex items-center px-4 py-3 hover:bg-gray-800 cursor-pointer gap-3">
            <div class="relative w-10 h-10 bg-gray-700 rounded-full flex items-center justify-center text-sm font-bold">
              AD
              <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-gray-950 rounded-full"></span>
            </div>
            <div class="flex-1">
              <div class="font-medium">Alice Dupont</div>
              <div class="text-sm text-gray-400 truncate">Hey, t'es là ?</div>
            </div>
            <span class="text-xs text-gray-500">14:32</span>
          </li>
        </ul>
      </aside>

      <!-- Main : Messages -->
      <main class="flex-1 flex flex-col justify-between">
        <!-- Top bar -->
        <div class="flex items-center gap-4 px-6 py-4 border-b border-gray-800">
          <div class="w-10 h-10 bg-gray-700 rounded-full flex items-center justify-center text-sm font-bold">
            AD
          </div>
          <div>
            <div class="font-semibold text-white">Alice Dupont</div>
            <div class="text-xs text-gray-400">En ligne</div>
          </div>
        </div>

        <!-- Messages list -->
        <div class="flex-1 overflow-y-auto px-6 py-4 space-y-4">
          <div *ngFor="let message of messages" class="flex flex-col"
            [ngClass]="{'items-start': message.from !== 'me', 'items-end': message.from === 'me'}">
            <span class="text-xs text-gray-400">{{ message.from === 'me' ? 'Me' : 'Alice Dupont' }}</span>
            <div
              [ngClass]="{'bg-blue-600 text-white': message.from === 'me', 'bg-gray-800 text-gray-300': message.from !== 'me'}"
              class="text-sm rounded-xl px-4 py-2 max-w-md">
              {{ message.content }}
            </div>
            <div class="text-xs text-gray-500">{{ message.timestamp | date:'shortTime' }}</div>
            <div class="text-xs text-gray-500">
              {{ message.status === 'read' ? '✔✔' : message.status === 'delivered' ? '✔' : '' }}
            </div>
          </div>
        </div>

        <!-- Input -->
        <div class="border-t border-gray-800 p-4 bg-gray-950">
          <div class="flex items-center gap-3">
            <input type="text" placeholder="Écris un message..."
              class="flex-1 bg-gray-800 text-white placeholder-gray-500 rounded-full px-4 py-2 border border-gray-700 focus:outline-none" />
            <button class="p-2 hover:bg-gray-800 rounded-full text-white" (click)="sendMessage()"
              (keydown.enter)="sendMessage()">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M22 2L11 13"></path>
                <path stroke-linecap="round" stroke-linejoin="round" d="M22 2L15 22l-4-9-9-4 20-7z"></path>
              </svg>
            </button>
          </div>
        </div>
      </main>
    </div>
  </div>
</div>
