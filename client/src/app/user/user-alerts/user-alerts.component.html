<meta name="robots" content="noindex">
<div class="container mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold text-center mb-4">Mes alertes enregistrées</h1>

  <!-- Gestion du chargement -->
  <div *ngIf="isLoading" class="text-center text-gray-400">
    <i class="fas fa-spinner fa-spin text-2xl"></i>
    <p>Chargement des alertes...</p>
  </div>

  <div class="space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
      <div *ngFor="let alert of alerts" class="relative">
        <app-card [card]="alert.card"></app-card>
        <!-- Checkbox notifications -->
        <div class="absolute bottom-2 right-2 flex items-center space-x-2">
          <label class="flex items-center cursor-pointer">
            <input type="checkbox" [(ngModel)]="alert.mail_active" (change)="onToggleNotification(alert)" />
            <span class="ml-2 text-sm text-gray-300 dark:text-gray-300">Mail</span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- Message si aucune alerte -->
  <div *ngIf="!isLoading && alerts.length === 0" class="text-center text-gray-400">
    <p>Aucune alerte enregistrée.</p>
  </div>
</div>
