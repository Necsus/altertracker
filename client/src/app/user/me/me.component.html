<meta name="robots" content="noindex">
<div class="container mx-auto p-6 text-white">
  <div class="bg-gray-800 p-6 rounded-2xl shadow-md">
    <h2 class="text-2xl font-bold mb-4">Profil Utilisateur</h2>

    <form (ngSubmit)="updateProfile()" #profileForm="ngForm">
      <div class="mb-4">
        <label class="block mb-1">Pseudo</label>
        <input type="text" [(ngModel)]="username" name="username" class="w-full p-2 bg-gray-700 rounded" required />
      </div>

      <!-- <div class="mb-4">
        <label class="block mb-1">Statistiques</label>
        <textarea [(ngModel)]="user.stats" name="stats" class="w-full p-2 bg-gray-700 rounded" rows="3"></textarea>
      </div> -->

      <button type="submit" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded">Sauvegarder</button>
    </form>

    <hr class="my-6 border-gray-600" />
    <button (click)="linkDiscord()" [ngClass]="{
      'bg-gray-500 cursor-not-allowed rounded-l-lg': discordLinked || loadingDiscord,
      'btn-discord rounded-lg': !discordLinked
    }" [disabled]="discordLinked || loadingDiscord" class="inline-flex items-center gap-2 px-4 py-2 font-semibold transition-all shadow-md
      text-white disabled:bg-gray-400 disabled:cursor-not-allowed">
      <ng-container *ngIf="loadingDiscord; else notLoading">
        <i class="fas fa-spinner animate-spin text-xl"></i>
        Connexion...
      </ng-container>

      <ng-template #notLoading>
        <i class="fab fa-discord text-xl"></i>
        {{ discordLinked ? 'Compte lié ✅' : 'Link Discord' }}
      </ng-template>
    </button>

    <button *ngIf="discordLinked" (click)="unlinkDiscord()" class="inline-flex items-center gap-2 px-4 py-2 rounded-r-lg font-semibold transition-all shadow-md
          text-white
          bg-red-600 hover:bg-red-700
          disabled:bg-gray-400 disabled:cursor-not-allowed">
      <i class="fas fa-unlink text-xl"></i>
    </button>

    <hr class="my-6 border-gray-600" />

    <form (ngSubmit)="changePassword()">
      <h3 class="text-xl font-semibold mb-2">Changer de mot de passe</h3>
      <div class="mb-2">
        <label class="block mb-1">Ancien mot de passe</label>
        <input type="password" [(ngModel)]="oldPassword" name="oldPassword" class="w-full p-2 bg-gray-700 rounded"
          required />
      </div>

      <div class="mb-2">
        <label class="block mb-1">Nouveau mot de passe</label>
        <input type="password" [(ngModel)]="newPassword" name="newPassword" class="w-full p-2 bg-gray-700 rounded"
          required />
      </div>

      <button type="submit" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded">Changer le mot de passe</button>
    </form>

    <hr class="my-6 border-gray-600" />

    <div>
      <h3 class="text-xl font-semibold mb-2 text-red-400">Supprimer le compte</h3>
      <p class="mb-4">Cette action est <strong>irréversible</strong>.</p>
      <div class="mb-2">
        <label class="block mb-1">Mot de passe</label>
        <input type="password" [(ngModel)]="passwordForDelete" name="passwordForDelete"
          class="w-full p-2 bg-gray-700 rounded" required />
      </div>
      <div class="mb-2">
        <label style="user-select: none;" class="block mb-1">Voulez-vous vraiment supprimer votre compte ?
          Tapez&nbsp;<strong>"Oui je
            veux
            supprimer mon compte"</strong></label>
        <input type="text" [(ngModel)]="yesIWantToDelete" name="yesIWantToDelete" class="w-full p-2 bg-gray-700 rounded"
          required />
      </div>
      <button (click)="deleteAccount()"
        [ngClass]="{'bg-gray-500 cursor-not-allowed': !validateDeleteAccount, 'bg-red-600 hover:bg-red-700': validateDeleteAccount}"
        class="px-4 py-2 rounded" [disabled]="!validateDeleteAccount">Supprimer
        mon
        compte</button>
    </div>
  </div>
</div>
