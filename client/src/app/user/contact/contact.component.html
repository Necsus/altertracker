<meta name="robots" content="noindex">
@if (!messageSended) {
<div class="py-20 flex items-center justify-center bg-gray-900">
  <div class="bg-gray-800 text-white rounded-lg shadow-lg p-8 w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-6">Contactez-nous</h2>
    <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
      <!-- Nom -->
      <div class="mb-4">
        <label for="name" class="block text-sm font-medium mb-2">Nom</label>
        <input type="text" id="name" formControlName="name"
          class="w-full px-4 py-2 rounded-lg bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Votre nom" required />
      </div>

      <!-- Email -->
      <div class="mb-4">
        <label for="email" class="block text-sm font-medium mb-2">Adresse e-mail</label>
        <input type="email" id="email" formControlName="email"
          class="w-full px-4 py-2 rounded-lg bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Votre e-mail" required />
      </div>

      <!-- Sujet -->
      <div class="mb-4">
        <label for="subject" class="block text-sm font-medium mb-2">Sujet</label>
        <input type="text" id="subject" formControlName="subject"
          class="w-full px-4 py-2 rounded-lg bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Sujet de votre message" required />
      </div>

      <!-- Message -->
      <div class="mb-4">
        <label for="message" class="block text-sm font-medium mb-2">Message</label>
        <textarea id="message" rows="4" formControlName="message"
          class="w-full px-4 py-2 rounded-lg bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Votre message..." required></textarea>
      </div>

      <!-- Bouton d'envoi -->
      <button type="submit" [disabled]="!isFormValid()"
        [ngClass]="{'bg-gray-500 cursor-not-allowed': !isFormValid(), 'bg-blue-600 hover:bg-blue-700': isFormValid()}"
        class="md:col-span-3 w-full text-white py-2 px-4 rounded-md transition duration-300">
        Envoyer le message
      </button>
    </form>
  </div>
</div>
}
@else {
<app-thank-you [context]="'contact'"></app-thank-you>
}
