<meta name="robots" content="noindex">
<div class="container mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold text-center mb-4">Mes offres d'achat</h1>

  <!-- Gestion du chargement -->
  <div *ngIf="isLoading" class="text-center text-gray-400">
    <i class="fas fa-spinner fa-spin text-2xl"></i>
    <p>Chargement des offres d'achat...</p>
  </div>

  <div class="space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
      <div *ngFor="let card of cards" class="relative">
        <app-card [card]="card"></app-card>
      </div>
    </div>
  </div>

  <!-- Message si aucune alerte -->
  <div *ngIf="!isLoading && cards.length === 0" class="text-center text-gray-400">
    <p>Aucune offre d'achat.</p>
  </div>
</div>
