<meta name="robots" content="noindex">
<div class="container mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold text-center mb-4">Mes offres d'achat</h1>

  <!-- Gestion du chargement -->
  <div *ngIf="isLoading" class="text-center text-gray-400">
    <i class="fas fa-spinner fa-spin text-2xl"></i>
    <p>Chargement des offres d'achat...</p>
  </div>

  <div class="space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
      <div *ngFor="let offer of offers" class="relative">
        <div class="bg-gray-700 pr-4 rounded-lg shadow-md flex flex-col md:flex-row relative">
          <a routerLink="/stats/{{offer.reference_card}}"
            class="absolute top-2 right-8 text-gray-400 hover:text-blue-500 transition duration-300">
            <i class="fas fa-chart-bar"></i>
          </a>
          <a (click)="deletePurchaseOffer(offer);"
            class="absolute top-2 right-2 text-gray-400 hover:text-red-500 transition duration-300 cursor-pointer">
            <i class="fas fa-trash"></i>
          </a>
          <img [src]="offer.card?.imagePath" [alt]="offer.card?.name"
            onerror="this.onerror=null; this.src='/assets/img/cardback.webp';" loading="lazy"
            class="max-w-full max-h-64 object-contain rounded-md mb-4 md:mb-0 md:mr-4 cursor-pointer">
          <div class="flex flex-col justify-center">
            <div class="flex items-center py-2">
              <a href="https://altered.gg/fr-fr/cards/{{offer.reference_card}}" target="_blank"
                class="text-xs text-blue-400 underline hover:text-blue-300">{{
                offer.reference_card }}&nbsp;<i class="fas fa-up-right-from-square text-xs"></i></a>
            </div>
            <div class="flex items-center py-2">
              <p class="text-gray-300 mr-2">Mon offre :
                {{offer.price}}{{offer.price?offer.currency:''}}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Message si aucune alerte -->
  <div *ngIf="!isLoading && offers.length === 0" class="text-center text-gray-400">
    <p>Aucune offre d'achat.</p>
  </div>
</div>
