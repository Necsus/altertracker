<meta name="robots" content="noindex">
<div class="container mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold text-center mb-4">Mes recherches enregistrées</h1>

  <!-- Gestion du chargement -->
  <div *ngIf="isLoading" class="text-center text-gray-400">
    <i class="fas fa-spinner fa-spin text-2xl"></i>
    <p>Chargement des recherches...</p>
  </div>

  <!-- Liste des recherches -->
  <div *ngIf="!isLoading && searches.length > 0" class="space-y-4">
    <ul class="space-y-2">
      <li *ngFor="let search of searches" (click)="goSearch(search.url_search)"
        class="group bg-gray-700 p-4 rounded-lg shadow-md cursor-pointer hover:bg-gray-600 transition duration-300">
        <div class="flex justify-between items-center">
          <div>
            <h4 class="text-white font-medium">{{ search.name_search }}</h4>
            <p class="text-sm text-gray-400 break-all">{{ search.url_search }}</p>
            <p class="text-xs text-gray-500">Créé le : {{ search.created_at | date:'short' }}</p>
          </div>
          <div class="flex space-x-2 px-4">
            <button (click)="deleteSearch(search.id); $event.stopPropagation()"
              class="delete-btn bg-red-600 hover:bg-red-700 text-white py-1 px-3 rounded-md transition duration-300">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </div>
      </li>
    </ul>
  </div>

  <!-- Message si aucune recherche -->
  <div *ngIf="!isLoading && searches.length === 0" class="text-center text-gray-400">
    <p>Aucune recherche enregistrée.</p>
  </div>
</div>
