<div class="py-20 flex items-center justify-center bg-gray-900">
  <div class="bg-gray-800 text-white rounded-lg shadow-lg p-8 w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-6">Réinitialisation du mot de passe</h2>
    <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
      <!-- Nouveau mot de passe -->
      <div class="mb-4">
        <label for="newPassword" class="block text-sm font-medium mb-2">Nouveau mot de passe</label>
        <input type="password" id="newPassword" formControlName="newPassword"
          class="w-full px-4 py-2 rounded-lg bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Entrez votre nouveau mot de passe" required />
      </div>

      <!-- Confirmer mot de passe -->
      <div class="mb-4">
        <label for="confirmPassword" class="block text-sm font-medium mb-2">Confirmer le mot de passe</label>
        <input type="password" id="confirmPassword" formControlName="confirmPassword"
          class="w-full px-4 py-2 rounded-lg bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Confirmez votre mot de passe" required />
      </div>

      <!-- Bouton de réinitialisation -->
      <button type="submit"
        class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-lg transition duration-300">
        Réinitialiser le mot de passe
      </button>

      <!-- Lien retour à la connexion -->
      <div class="text-center mt-6">
        <a routerLink="/login" class="text-sm text-blue-400 hover:underline cursor-pointer">Retour à la connexion</a>
      </div>
    </form>
  </div>
</div>
