<meta name="robots" content="noindex">
<div class="py-20 flex items-center justify-center bg-gray-900">
  <div class="bg-gray-800 text-white rounded-lg shadow-lg p-8 w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-6">Mot de passe oublié</h2>
    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
      <!-- Email -->
      <div class="mb-4">
        <label for="email" class="block text-sm font-medium mb-2">Adresse e-mail</label>
        <input type="email" id="email" formControlName="email"
          class="w-full px-4 py-2 rounded-lg bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-amber-500"
          placeholder="Entrez votre e-mail" required />
      </div>

      <!-- Bouton de réinitialisation -->
      <button type="submit"
        class="w-full bg-amber-500 hover:bg-amber-600 text-white font-medium py-2 px-4 rounded-lg transition duration-300">
        Réinitialiser le mot de passe
      </button>

      <!-- Lien retour à la connexion -->
      <div class="text-center mt-6">
        <a routerLink="/login" class="text-sm text-amber-400 hover:underline cursor-pointer">Retour à la connexion</a>
      </div>
    </form>
  </div>
</div>
