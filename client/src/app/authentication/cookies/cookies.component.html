<!-- Popin RGPD Cookies -->
<div *ngIf="showCookieConsent"
  class="fixed inset-0 z-50 flex items-end md:items-center justify-center bg-black bg-opacity-40">
  <div class="bg-white text-gray-900 rounded-xl shadow-lg p-6 max-w-md w-full m-4">
    <div class="flex items-center gap-3 mb-3">
      <span class="text-2xl">🍪</span>
      <h2 class="text-lg font-bold">Gestion des cookies</h2>
    </div>
    <p class="mb-4 text-sm">
      Nous utilisons des cookies pour améliorer votre expérience, analyser le trafic et personnaliser le contenu. Vous
      pouvez accepter ou refuser les cookies non essentiels.
    </p>
    <div class="flex flex-col md:flex-row gap-2 justify-end">
      <button class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded transition"
        (click)="refuseCookies()">
        Refuser
      </button>
      <button class="bg-amber-500 hover:bg-amber-600 text-white font-semibold py-2 px-4 rounded transition"
        (click)="acceptCookies()">
        Accepter
      </button>
    </div>
  </div>
</div>
