<div class="py-20 flex items-center justify-center bg-gray-900">
  <div class="bg-gray-800 text-white rounded-lg shadow-lg p-8 w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-6">{{ 'authentication.register' | translate }}</h2>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <!-- Nom -->
      <div class="mb-4">
        <label for="username" class="block text-sm font-medium mb-2">{{ 'authentication.pseudo' | translate }}</label>
        <input type="text" id="username" formControlName="username"
          class="w-full px-4 py-2 rounded-lg bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-amber-500"
          placeholder="Enter your pseudo" required />
      </div>

      <!-- Email -->
      <div class="mb-4">
        <label for="email" class="block text-sm font-medium mb-2">{{ 'authentication.email' | translate }}</label>
        <input type="email" id="email" formControlName="email"
          class="w-full px-4 py-2 rounded-lg bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-amber-500"
          placeholder="Enter your e-mail" required />
      </div>

      <!-- Mot de passe -->
      <div class="mb-4">
        <label for="password" class="block text-sm font-medium mb-2">{{ 'authentication.password' | translate }}</label>
        <input type="password" id="password" formControlName="password"
          class="w-full px-4 py-2 rounded-lg bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-amber-500"
          placeholder="Create password" required />
      </div>

      <!-- Bouton d'inscription -->
      <button type="submit"
        class="w-full bg-amber-500 hover:bg-amber-600 text-white font-medium py-2 px-4 rounded-lg transition duration-300">
        {{ 'authentication.register_action' | translate }}
      </button>

      <!-- Lien vers Connexion -->
      <div class="text-center mt-6">
        <p class="text-sm">
          {{ 'authentication.already_have_account' | translate }}
          <a routerLink="/login" class="text-amber-400 hover:underline cursor-pointer">{{ 'authentication.login_action'
            |
            translate }}</a>
        </p>
      </div>
    </form>
  </div>
</div>
