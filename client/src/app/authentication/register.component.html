<div class="py-20 flex items-center justify-center bg-gray-900">
  <div class="bg-gray-800 text-white rounded-lg shadow-lg p-8 w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-6">Inscription</h2>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <!-- Nom -->
      <div class="mb-4">
        <label for="username" class="block text-sm font-medium mb-2">Pseudo</label>
        <input type="text" id="username" formControlName="username"
          class="w-full px-4 py-2 rounded-lg bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Entrez votre pseudo" required />
      </div>

      <!-- Email -->
      <div class="mb-4">
        <label for="email" class="block text-sm font-medium mb-2">Adresse e-mail</label>
        <input type="email" id="email" formControlName="email"
          class="w-full px-4 py-2 rounded-lg bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Entrez votre e-mail" required />
      </div>

      <!-- Mot de passe -->
      <div class="mb-4">
        <label for="password" class="block text-sm font-medium mb-2">Mot de passe</label>
        <input type="password" id="password" formControlName="password"
          class="w-full px-4 py-2 rounded-lg bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Créez un mot de passe" required />
      </div>

      <!-- Bouton d'inscription -->
      <button type="submit"
        class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-lg transition duration-300">
        S'inscrire
      </button>

      <!-- Lien vers Connexion -->
      <div class="text-center mt-6">
        <p class="text-sm">
          Vous avez déjà un compte ?
          <a routerLink="/login" class="text-blue-400 hover:underline cursor-pointer">Connectez-vous</a>
        </p>
      </div>
    </form>
  </div>
</div>
