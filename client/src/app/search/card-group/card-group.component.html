      @if (cards.length > 0) {
      <label for="{{ groupName }}-groupCheckbox" class="text-gray-300 text-sm">{{ 'cards.only_in_market' | translate
        }}</label>
      <input (change)="onOnlyCardsWithPrice($event)" type="checkbox" id="{{ groupName }}-groupCheckbox"

    <button (click)="toggleGroup()"
      class="w-full text-left text-2xl font-semibold mb-4 focus:outline-none cursor-pointer">{{
      groupName }} ({{ cards.length }})<span *ngIf="onlyCardsWithPrice">&nbsp;{{ 'cards.in_market' | translate
        }}&nbsp;({{ visibleCards.length
        }})</span></button>
    @if (isGroupOpen) {
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
      <app-card *ngFor="let card of visibleCards | slice:0:displayedCards" [card]="card"></app-card>
    </div>
    <button *ngIf="cards.length > displayedCards" (click)="loadMore()"
      class="bg-amber-600 hover:bg-amber-700 w-full text-white py-2 px-4 rounded-md transition duration-300 mt-4 flex items-center justify-center">
      {{ 'cards.load_more' | translate }}
    </button>
