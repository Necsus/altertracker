<div class="space-y-4">
  <!-- Group -->
  <div class="bg-gray-800 p-4 rounded-lg shadow-lg relative">
    <!-- Case à cocher et bouton en haut à droite -->
    <div class="absolute top-4 right-4 flex items-center space-x-2">
      @if (cards.length > 0) {
      <label for="{{ groupName }}-groupCheckbox" class="text-gray-300 text-sm">Only in market</label>
      <input (change)="onOnlyCardsWithPrice($event)" type="checkbox" id="{{ groupName }}-groupCheckbox"
        class="h-4 w-4 text-blue-600 bg-gray-700 border-gray-600 rounded focus:ring-blue-500 focus:ring-offset-gray-800">
      }
    </div>
    <button (click)="toggleGroup()" class="w-full text-left text-2xl font-semibold mb-4 focus:outline-none">{{
      groupName }} ({{ cards.length }})<span *ngIf="onlyCardsWithPrice">&nbsp;in market ({{ visibleCards.length
        }})</span></button>
    @if (isGroupOpen) {
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
      <!-- Card -->
      <app-card *ngFor="let card of visibleCards | slice:0:displayedCards" [card]="card"></app-card>
    </div>
    <button *ngIf="cards.length > displayedCards" (click)="loadMore()"
      class="bg-blue-600 hover:bg-blue-700 w-full text-white py-2 px-4 rounded-md transition duration-300 mt-4 flex items-center justify-center">
      <!-- <ng-container *ngIf="getMarketComplete; else loading">
        Charger plus
      </ng-container>
      <ng-template #loading>
        <svg class="animate-spin h-5 w-5 mr-2 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
          viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
        </svg>
        Chargement...
      </ng-template> -->
      Charger plus
    </button>
    }
  </div>
</div>
