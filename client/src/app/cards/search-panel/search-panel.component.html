<form [formGroup]="searchForm" (ngSubmit)="onSubmit()"
  class="bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 p-6 rounded-2xl shadow-xl text-white">

  <div class="grid grid-cols-1 md:grid-cols-6 gap-6">
    <!-- Nom / Référence -->
    <div class="col-span-3">
      <label for="name" class="block mb-1 text-sm font-semibold text-purple-200">Nom ou Réf (ALT_)</label>
      <input id="name" formControlName="name" type="text"
        class="w-full p-2 bg-gray-700 rounded-lg border border-purple-500 focus:ring-2 focus:ring-purple-400 outline-none transition" />
    </div>

    <!-- Rareté -->
    <div class="col-span-1">
      <label for="rarity" class="block mb-1 text-sm font-semibold text-purple-200">Rareté</label>
      <select id="rarity" formControlName="rarity"
        class="w-full p-2 bg-gray-700 rounded-lg border border-purple-500 focus:ring-2 focus:ring-purple-400 outline-none transition">
        <option value="">-- Rarity --</option>
        <option value="COMMON">⚪ Commune</option>
        <option value="RARE">🔵 Rare</option>
        <option value="UNIQUE">🟡 Unique</option>
      </select>
    </div>

    <!-- Faction -->
    <div class="col-span-1">
      <label for="faction" class="block mb-1 text-sm font-semibold text-purple-200">Faction</label>
      <select id="faction" formControlName="faction"
        class="w-full p-2 bg-gray-700 rounded-lg border border-purple-500 focus:ring-2 focus:ring-purple-400 outline-none transition">
        <option value="">-- Faction --</option>
        <option value="AX">Axiom</option>
        <option value="BR">Bravos</option>
        <option value="LY">Lyra</option>
        <option value="MU">Muna</option>
        <option value="OR">Ordis</option>
        <option value="YZ">Yzmir</option>
      </select>
    </div>

    <!-- Set -->
    <div class="col-span-1">
      <label for="set" class="block mb-1 text-sm font-semibold text-purple-200">Set</label>
      <select id="set" formControlName="set"
        class="w-full p-2 bg-gray-700 rounded-lg border border-purple-500 focus:ring-2 focus:ring-purple-400 outline-none transition">
        <option value="">-- Set --</option>
        <option value="BISE">Murmures du labyrinthe</option>
        <option value="ALIZE">Epreuve du froid</option>
        <option value="CORE">Au-delà des portes</option>
        <option value="COREKS">Au-delà des portes - KS</option>
      </select>
    </div>

    <!-- Effets -->
    <div class="col-span-2">
      <label class="block mb-1 text-sm font-semibold text-purple-200">Effet Principal</label>
      <input id="main_effect" formControlName="main_effect" type="text"
        class="w-full p-2 bg-gray-700 rounded-lg border border-purple-500 focus:ring-2 focus:ring-purple-400" />
    </div>
    <div class="col-span-2">
      <label class="block mb-1 text-sm font-semibold text-purple-200">et Effet Principal 2</label>
      <input id="main_effect_2" formControlName="main_effect_2" type="text"
        class="w-full p-2 bg-gray-700 rounded-lg border border-purple-500 focus:ring-2 focus:ring-purple-400" />
    </div>
    <div class="col-span-2">
      <label class="block mb-1 text-sm font-semibold text-purple-200">Effet support</label>
      <input id="echo_effect" formControlName="echo_effect" type="text"
        class="w-full p-2 bg-gray-700 rounded-lg border border-purple-500 focus:ring-2 focus:ring-purple-400" />
    </div>

    <!-- Coûts -->
    <div>
      <label class="block mb-1 text-sm text-purple-200 font-semibold">Coût Main (1-3)</label>
      <input formControlName="main_cost_range" type="text"
        class="w-full p-2 bg-gray-700 rounded-lg border border-purple-500 focus:ring-2 focus:ring-purple-400" />
    </div>
    <div>
      <label class="block mb-1 text-sm text-purple-200 font-semibold">Coût Réserve (1-3)</label>
      <input formControlName="recall_cost_range" type="text"
        class="w-full p-2 bg-gray-700 rounded-lg border border-purple-500 focus:ring-2 focus:ring-purple-400" />
    </div>

    <!-- Énergies -->
    <div>
      <label class="block mb-1 text-sm text-green-200 font-semibold">🌿 Forêt (1-3)</label>
      <input formControlName="forest_power_range" type="text"
        class="w-full p-2 bg-gray-700 rounded-lg border border-green-500 focus:ring-2 focus:ring-green-400" />
    </div>
    <div>
      <label class="block mb-1 text-sm text-red-200 font-semibold">🗻 Montagne (1-3)</label>
      <input formControlName="mountain_power_range" type="text"
        class="w-full p-2 bg-gray-700 rounded-lg border border-red-500 focus:ring-2 focus:ring-red-400" />
    </div>
    <div>
      <label class="block mb-1 text-sm text-blue-200 font-semibold">💧 Océan (1-3)</label>
      <input formControlName="ocean_power_range" type="text"
        class="w-full p-2 bg-gray-700 rounded-lg border border-blue-500 focus:ring-2 focus:ring-blue-400" />
    </div>
  </div>

  <!-- Checkboxes -->
  <div class="flex flex-wrap justify-center gap-4 mt-6">
    <label class="inline-flex items-center text-sm text-gray-300">
      <input type="checkbox" formControlName="no_condition" class="form-checkbox bg-gray-600 text-purple-500 rounded" />
      <span class="ml-2">Supprimer Si/S'il</span>
    </label>
    <label class="inline-flex items-center text-sm text-gray-300"
      title="Cherche uniquement les cartes présente dans la Db AlterTracker">
      <input type="checkbox" formControlName="in_market" class="form-checkbox bg-gray-600 text-purple-500 rounded" />
      <span class="ml-2">
        Db Market
        <i class="fas fa-question-circle ml-2"
          ngbTooltip="Cherche uniquement les cartes ayant un prix dans la Db AlterTracker, il peut manquer des données"></i>
      </span>
    </label>
    <label class="inline-flex items-center text-sm text-gray-300">
      <input type="checkbox" formControlName="search_offers"
        class="form-checkbox bg-gray-600 text-purple-500 rounded" />
      <span class="ml-2">
        Live Market
        <i class="fas fa-question-circle ml-2"
          ngbTooltip="Cherche les données en direct sur l'api altered, token requis"></i>
      </span>
    </label>
  </div>

  <!-- Submit -->
  <div class="mt-8 text-center">
    <button type="submit" [disabled]="!isFormValid()" [ngClass]="{
        'bg-gray-500 cursor-not-allowed': !isFormValid(),
        'bg-gradient-to-r from-purple-600 to-blue-500 hover:from-purple-700 hover:to-blue-600': isFormValid()
      }" class="px-6 py-3 text-white font-semibold rounded-lg shadow-lg transition">
      🔍 Rechercher
    </button>
  </div>
</form>
