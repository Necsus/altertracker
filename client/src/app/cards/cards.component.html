<div class="flex bg-gray-900 text-white">
  <div #sidebar class=" w-64 bg-gradient-to-b from-gray-800 to-gray-900 p-4 transition-transform duration-300"
    [class.-translate-x-full]="!sidebarOpen">
    <app-search-panel (cardsRetrieved)="onCardsRetrieved($event)"></app-search-panel>
  </div>

  <!-- Main content -->
  <div class="flex-1 flex flex-col transition-all duration-300" [class.w-full]="!sidebarOpen">
    <!-- Top bar -->
    <div class="flex justify-between items-center p-4 transition-all duration-300">
      <div>
        <button id="toggleSlider" class="p-2 bg-gray-700 rounded hover:bg-gray-600 transition cursor-pointer"
          (click)="toggleFilterSlider()">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
      <div class="flex items-center gap-4">
        <div>
          <label class="mr-2 font-semibold">Trié par</label>
          <select class="p-2 bg-gray-700 rounded-lg border border-amber-500">
            <option>Nom</option>
            <option>Rareté</option>
            <option>Faction</option>
            <option>Prix</option>
          </select>
        </div>
        <div>
          <label class="mr-2 font-semibold">Groupé par</label>
          <select class="p-2 bg-gray-700 rounded-lg border border-amber-500">
            <option>Nom</option>
            <option>Faction</option>
            <option>Cout de main</option>
          </select>
        </div>
        @if (isLoggedIn) {
        <app-save-search [canSaveSearch]="cards && cards.length > 0"></app-save-search>
        }
      </div>
    </div>

    <!-- Results -->
    <div class="flex-1 overflow-auto p-4">
      <!-- Ici tu mettras ton affichage de cartes -->
      <div class="text-center text-gray-400">
        <div *ngFor="let group of groupedCards | keyvalue" class="mb-8">
          <app-card-group [groupName]="group.key" [cards]="group.value" [autoOpen]="group.key === autoOpenGroup"
            [allGroupsOpen]="allGroupsOpen" (visibleCardsChange)="onVisibleCardsChange($event)">
          </app-card-group>
        </div>
      </div>
    </div>
  </div>
</div>
