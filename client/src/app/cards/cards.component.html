<div class="container mx-auto px-4 py-8">
  <h1 class="text-4xl font-bold text-center mb-4">Recherche de cartes</h1>
  <p class="text-center mb-8">parmis les <strong>{{nbCards}}</strong> cartes d'Altered dont
    <strong>{{nbCardsInMarket}}</strong> sur le market
  </p>
  <app-search-panel (cardsRetrieved)="onCardsRetrieved($event)"></app-search-panel>

  @if (cards && cards.length > 0) {
  <p class="text-lg mb-4"><span class="font-bold">{{cards.length}}</span> cartes trouvées.</p>
  }

  <div *ngFor="let group of groupedCards | keyvalue" class="mb-8">
    <app-card-group [groupName]="group.key" [cards]="group.value" [autoOpen]="group.key === autoOpenGroup"
      (visibleCardsChange)="onVisibleCardsChange($event)">
    </app-card-group>
  </div>
</div>
