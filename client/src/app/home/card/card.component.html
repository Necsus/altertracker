<div class="bg-gray-700 p-4 rounded-lg shadow-md flex flex-col md:flex-row">
  <img [src]="card.imagePath" [alt]="card.name"
    class="max-w-full max-h-64 object-contain rounded-md mb-4 md:mb-0 md:mr-4">
  <div class="flex flex-col justify-center">
    <h3 class="text-xl font-semibold mb-2">{{ card.name }}</h3>
    <p class="text-gray-300 mb-2">Effet: {{ card.MAIN_EFFECT }}</p>
    <p class="text-gray-300">Coût: {{ card.MAIN_COST }}</p>
  </div>
</div>
