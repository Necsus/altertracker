<form [formGroup]="searchForm" (ngSubmit)="onSubmit()" class="bg-gray-800 p-4 rounded-lg shadow-lg mb-8">
  <h2 class="text-xl font-semibold mb-4">Rechercher des cartes</h2>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div>
      <label for="name" class="block text-sm font-medium text-gray-300">Nom</label>
      <input type="text" id="name" formControlName="name"
        class="mt-1 block w-full bg-gray-700 border border-gray-600 rounded-md shadow-sm p-2 text-white">
    </div>
    <div>
      <label for="effect" class="block text-sm font-medium text-gray-300">Effet</label>
      <input type="text" id="effect" formControlName="effect"
        class="mt-1 block w-full bg-gray-700 border border-gray-600 rounded-md shadow-sm p-2 text-white">
    </div>
    <div>
      <label for="cost" class="block text-sm font-medium text-gray-300">Coût</label>
      <input type="number" id="cost" formControlName="cost"
        class="mt-1 block w-full bg-gray-700 border border-gray-600 rounded-md shadow-sm p-2 text-white">
    </div>
    <button type="submit"
      class="md:col-span-3 w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition duration-300">Rechercher</button>
  </div>
</form>
