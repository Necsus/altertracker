<!-- Modal Buy Me a Coffee -->
<div *ngIf="showBuyMeACoffeeModal"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 animate-fade-in">
  <div
    class="bg-gradient-to-br from-amber-50 to-orange-100 text-gray-900 rounded-2xl shadow-2xl p-8 max-w-lg w-full m-4 transform animate-bounce-in">
    <!-- Header avec animation -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-amber-500 rounded-full mb-4 animate-pulse">
        <span class="text-3xl">☕</span>
      </div>
      <h2 class="text-2xl font-bold text-gray-800 mb-2">
        {{ 'buymeacoffee.title' | translate }}
      </h2>
      <p class="text-amber-600 font-medium">
        {{ 'buymeacoffee.subtitle' | translate }}
      </p>
    </div>

    <!-- Message principal -->
    <div class="text-center mb-6">
      <p class="text-gray-700 mb-4 leading-relaxed">
        {{ 'buymeacoffee.message' | translate }}
      </p>
      <div class="flex items-center justify-center gap-2 text-amber-600">
        <span class="text-xl">💡</span>
        <span class="text-sm font-medium">
          {{ 'buymeacoffee.help_message' | translate }}
        </span>
      </div>
    </div>

    <!-- Boutons d'action -->
    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <button
        class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-6 rounded-xl transition-all duration-300 transform hover:scale-105 hover:shadow-lg flex items-center justify-center gap-2"
        (click)="openBuyMeACoffee()">
        <span class="text-xl">☕</span>
        {{ 'buymeacoffee.support_btn' | translate }}
      </button>

      <button
        class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-3 px-6 rounded-xl transition-all duration-300"
        (click)="remindLater()">
        {{ 'buymeacoffee.later_btn' | translate }}
      </button>
    </div>

    <!-- Option "Ne plus me demander" -->
    <div class="text-center mt-4">
      <button class="text-xs text-gray-500 hover:text-gray-700 underline transition-colors" (click)="neverAskAgain()">
        {{ 'buymeacoffee.never_ask' | translate }}
      </button>
    </div>

    <!-- Bouton fermer discret -->
    <button class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors"
      (click)="closeBuyMeACoffeeModal()">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>
</div>
