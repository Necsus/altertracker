<div class="bg-gray-900 text-white p-6 rounded-2xl shadow-xl max-w-md w-full">
  <h2 class="text-xl font-semibold mb-4">Poster une offre d'achat</h2>

  <form [formGroup]="purchaseForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- Prix -->
    <div>
      <label for="price" class="block text-sm font-medium mb-1">Prix</label>
      <input type="number" id="price" name="price" placeholder="Entrez un prix" formControlName="price"
        class="w-full rounded-lg border border-gray-700 bg-gray-800 text-white p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>

    <!-- Devise -->
    <div>
      <label for="currency" class="block text-sm font-medium mb-1">Devise</label>
      <select id="currency" name="currency" formControlName="currency"
        class="w-full rounded-lg border border-gray-700 bg-gray-800 text-white p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="USD">USD - Dollar</option>
        <option value="EUR">EUR - Euro</option>
      </select>
    </div>

    <!-- Actions -->
    <div class="flex justify-end space-x-2 pt-4">
      <button type="submit" [disabled]="!isFormValid()"
        [ngClass]="{'bg-gray-500 cursor-not-allowed': !isFormValid(), 'bg-blue-600 hover:bg-blue-700': isFormValid()}"
        class="md:col-span-3 w-full text-white py-2 px-4 rounded-md transition duration-300">
        Poster
      </button>
    </div>
  </form>
</div>
