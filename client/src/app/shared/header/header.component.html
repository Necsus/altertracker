<header class="bg-gray-800 text-white shadow-lg">
  <div class="container mx-auto px-4 py-4">
    <nav class="flex justify-between items-center">
      <div class="flex items-center">
        <img src="assets/img/test_logo_2.png" alt="Logo" class="h-10 mr-2">
        <div class="text-2xl font-bold">AlterTracker</div>
      </div>
      <ul class="flex space-x-6">
        <li><a routerLink="/" routerLinkActive="text-blue-400" [routerLinkActiveOptions]="{ exact: true }"
            class="hover:text-blue-300 transition duration-300 cursor-pointer">Cartes</a></li>
        <li><a routerLink="/offres" routerLinkActive="text-blue-400"
            class="hover:text-blue-300 transition duration-300 cursor-pointer">Offres</a></li>
        <li><a routerLink="/a-propos" routerLinkActive="text-blue-400"
            class="hover:text-blue-300 transition duration-300 cursor-pointer">À propos</a></li>
        <li><a routerLink="/contact" routerLinkActive="text-blue-400"
            class="hover:text-blue-300 transition duration-300 cursor-pointer">Contact</a></li>
        <li><a routerLink="/login" routerLinkActive="text-blue-400"
            class="hover:text-blue-300 transition duration-300 cursor-pointer">Login</a></li>
      </ul>
    </nav>
  </div>
</header>
