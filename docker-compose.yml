services:
  db:
    image: postgres:16
    restart: always
    env_file:
      - ./config/production.env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend

  api:
    build: ./api
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - ./config/production.env
    expose:
      - "5000"
    networks:
      - backend

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    networks:
      - backend

  web:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/webroot:/var/www/certbot
      - ./nginx/robots.txt:/etc/nginx/static/robots.txt
      - ./nginx/sitemap.xml:/etc/nginx/static/sitemap.xml
      - ./client/dist/client/browser:/usr/share/nginx/html
    depends_on:
      - api
    networks:
      - backend
      - frontend

  bot:
    build: ./bot
    restart: always
    env_file:
      - ./config/production.env
    depends_on:
      - api
    networks:
      - backend

  certbot:
    image: certbot/certbot
    restart: always
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/webroot:/var/www/certbot
    entrypoint: >
      sh -c "certbot certonly --webroot -w /var/www/certbot --non-interactive --agree-tos --email necsus.dev@proton.me -d altertracker.com -d www.altertracker.com"
    depends_on:
      - web
    networks:
      - frontend

volumes:
  db_data:

networks:
  frontend:
  backend: