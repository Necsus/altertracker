name: Deploy to Server k8s

on:
  push:
    branches:
      - production-k8s

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: github-actions-ci

      - name: Set up Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

      - name: Create namespace altertracker (idempotent)
        run: kubectl create namespace altertracker || true

      - name: Create/update Postgres secret
        run: |
          kubectl create secret generic postgres-secret \
            --namespace altertracker \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_DB="${{ secrets.POSTGRES_DB }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create/update BOT secret
        run: |
          kubectl create secret generic bot-secret \
            --namespace altertracker \
            --from-literal=DISCORD_BOT_TOKEN="${{ secrets.DISCORD_BOT_TOKEN }}" \
            --from-literal=GUILD_ID="${{ vars.GUILD_ID }}" \
            --from-literal=ROLE_ID="${{ vars.ROLE_ID }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create/update API secret
        run: |
          kubectl create secret generic api-secret \
            --namespace altertracker \
            --from-literal=DATABASE_URL="postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres.altertracker.svc.cluster.local:5432/${{ secrets.POSTGRES_DB }}" \
            --from-literal=CORS_ORIGINS="${{ vars.CORS_ORIGINS }}" \
            --from-literal=PASSWORD_PEPPER="${{ secrets.PASSWORD_PEPPER }}" \
            --from-literal=SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=BREVO_API_KEY="${{ secrets.BREVO_API_KEY }}" \
            --from-literal=ANGULAR_URL="${{ vars.ANGULAR_URL }}" \
            --from-literal=FLASK_ENV="${{ vars.FLASK_ENV }}" \
            --from-literal=DISCORD_CLIENT_ID="${{ vars.DISCORD_CLIENT_ID }}" \
            --from-literal=DISCORD_CLIENT_SECRET="${{ secrets.DISCORD_CLIENT_SECRET }}" \
            --from-literal=DISCORD_REDIRECT_URI="${{ vars.DISCORD_REDIRECT_URI }}" \
            --from-literal=DISCORD_BOT_URI="${{ vars.DISCORD_BOT_URI }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login to registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login registry.altertracker.com -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Build and push BOT image
        run: |
          docker build --no-cache -t registry.altertracker.com/altertracker-bot:latest ./bot
          docker push registry.altertracker.com/altertracker-bot:latest

      - name: Build and push API image
        run: |
          docker build --no-cache -t registry.altertracker.com/altertracker-api:latest ./api
          docker push registry.altertracker.com/altertracker-api:latest

      - name: Build and push CLIENT image
        run: |
          docker build --no-cache -t registry.altertracker.com/altertracker-client:latest ./client
          docker push registry.altertracker.com/altertracker-client:latest

      - name: Deploy Postgres manifests
        run: |
          kubectl apply -n altertracker -f ./k8s/postgres/

      - name: Deploy Redis manifests
        run: |
          kubectl apply -n altertracker -f ./k8s/redis/

      - name: Deploy BOT manifests
        run: |
          kubectl apply -n altertracker -f ./k8s/bot/

      - name: Deploy API manifests
        run: |
          kubectl apply -n altertracker -f ./k8s/api/

      - name: Deploy CLIENT manifests
        run: |
          kubectl apply -n altertracker -f ./k8s/client/

      - name: Deploy PersistentVolumeClaim
        run: |
          kubectl apply -n altertracker -f ./k8s/postgres/pvc.yaml

      - name: Deploy Ingress
        run: |
          kubectl apply -n altertracker -f ./k8s/ingress.yaml

      - name: Rollout restart BOT
        run: kubectl rollout restart deployment bot -n altertracker

      - name: Rollout restart API
        run: kubectl rollout restart deployment api -n altertracker

      - name: Rollout restart CLIENT
        run: kubectl rollout restart deployment client -n altertracker