name: Deploy to Server

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to server
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          set -euo pipefail

          echo "[+] Active la page de maintenance"
          cp ./nginx/maintenance.html ./client/dist/client/browser/
          docker compose restart web

          export POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          export POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          export POSTGRES_DB=${{ secrets.POSTGRES_DB }}

          echo "[+] Début du déploiement à $(date)"
          cd ~/geekom/uniquetracker

          echo "[+] Pull du code depuis GitHub"
          git pull origin main

          echo "[+] Execute npm install et build"
          cd ~/geekom/uniquetracker/client
          rm -rf node_modules package-lock.json dist
          npm cache clean --force
          npm install
          npm run build --production

          cd ~/geekom/uniquetracker

          echo "[+] Lancement de Nginx temporaire (port 80) pour Certbot"
          docker compose up -d web

          echo "[+] Vérification de l'existence du certificat"
          if [ ! -f "./nginx/certbot/conf/live/altertracker.com/fullchain.pem" ]; then
            echo "[+] Génération du certificat SSL via Let's Encrypt"
            docker compose run --rm certbot
          else
            echo "[✓] Certificat SSL déjà présent, génération ignorée"
          fi

          echo "[+] Rebuild et redémarrage de Docker"
          docker compose down
          docker compose build
          docker compose up -d

          echo "[+] Retire la page de maintenance"
          rm -f ./client/dist/client/browser/maintenance.html
          docker compose restart web

          echo "[✓] Déploiement terminé avec succès"
          exit 0
        EOF