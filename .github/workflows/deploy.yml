name: Deploy to Server

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to server
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          set -euo pipefail

          export POSTGRES_USER="${{ secrets.POSTGRES_USER }}"
          export POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
          export POSTGRES_DB="${{ secrets.POSTGRES_DB }}"
          export CORS_ORIGINS="${{ vars.CORS_ORIGINS }}"
          export PASSWORD_PEPPER="${{ secrets.PASSWORD_PEPPER }}"
          export SECRET_KEY="${{ secrets.SECRET_KEY }}"
          export JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}"
          export BREVO_API_KEY="${{ secrets.BREVO_API_KEY }}"
          export ANGULAR_URL="${{ vars.ANGULAR_URL }}"
          export FLASK_ENV="${{ vars.FLASK_ENV }}"

          echo "[+] Génération du fichier config/production.env"
          mkdir -p config
          cat > config/production.env <<EOL
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_DB=$POSTGRES_DB
          CORS_ORIGINS=$CORS_ORIGINS
          PASSWORD_PEPPER=$PASSWORD_PEPPER
          SECRET_KEY=$SECRET_KEY
          JWT_SECRET_KEY=$JWT_SECRET_KEY
          BREVO_API_KEY=$BREVO_API_KEY
          ANGULAR_URL=$ANGULAR_URL
          FLASK_ENV=$FLASK_ENV
          EOL

          echo "[+] Début du déploiement à $(date)"
          cd ~/geekom/uniquetracker

          echo "[+] Pull du code depuis GitHub"
          git pull origin production

          echo "[+] Execute npm install et build"
          cd ~/geekom/uniquetracker/client
          rm -rf node_modules package-lock.json dist
          npm cache clean --force
          npm install
          npm run build --production

          cd ~/geekom/uniquetracker

          echo "[+] Rebuild et redémarrage de Docker"
          docker compose down
          docker compose build
          docker compose up -d

          echo "[✓] Déploiement terminé avec succès"
          exit 0
        EOF