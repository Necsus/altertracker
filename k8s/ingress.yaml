apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: altertracker-ingress
  namespace: altertracker
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/server-snippet: |
      if ($host = 'www.altertracker.com') {
        return 301 https://altertracker.com$request_uri;
      }
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - altertracker.com
        - www.altertracker.com
      secretName: altertracker-tls
  rules:
    - host: altertracker.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 5001
          - path: /socket.io/
            pathType: ImplementationSpecific
            backend:
              service:
                name: api
                port:
                  number: 5001