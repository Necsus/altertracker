apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: altertracker
  annotations:
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: www.altertracker.com
    http:
      paths:
      - backend:
          service:
            name: angular
            port:
              number: 80
        path: /
        pathType: Prefix