apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot
  namespace: altertracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bot
  template:
    metadata:
      labels:
        app: bot
    spec:
      containers:
        - name: bot
          image: registry.altertracker.com/altertracker-bot:latest
          ports:
            - containerPort: 5001
          envFrom:
            - secretRef:
                name: bot-secret